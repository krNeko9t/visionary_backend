[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visionary-progress"
version = "0.1.0"
description = "Shared progress records for Visionary orchestration and workers"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["visionary_progress*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
exclude = ["docker_workers/.*/submodules/"]
