model:
  resolution: 1
optimization:
  iterations: 45000
  densify_from_iter: 500
  densify_until_iter: 25000
  densification_interval: 80
  densify_grad_threshold: 0.00012
  opacity_reset_interval: 2500
  lambda_dssim: 0.2
pipeline:
  antialiasing: true
training:
  output_iteration: 45000
  save_iterations: [30000, 45000]
  checkpoint_iterations: [30000, 45000]
  test_iterations: [7000, 30000, 45000]