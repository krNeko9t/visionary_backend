# LangSplatV2：preprocess.py + train.py
# source_path / model_path / start_checkpoint 由 executor 注入

runtime:
  worker_image: langsplatv2:pt241
  model_relative: langsplatv2
  # 宿主机 ckpts 绝对路径；留空则自动从 task-server 的 ckpts_root 挂载解析
  ckpts_host: ""

preprocess:
  resolution: -1
  sam_ckpt_path: ckpts/sam_vit_h_4b8939.pth

model:
  sh_degree: 3
  language_features_name: language_features
  images: images
  resolution: -1
  white_background: false
  feature_levels: [0]
  data_device: cuda
  eval: false

optimization:
  iterations: 10000
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  language_feature_lr: 0.0025
  include_feature: true
  quick_render: false
  vq_layer_num: 1
  codebook_size: 64
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002

pipeline:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false

training:
  test_iterations: [2000, 6000, 10000]
  save_iterations: [2000, 6000, 10000]
  checkpoint_iterations: [2000, 6000, 10000]
  cos_loss: true
  l1_loss: false
  normalize: false
  accum_iter: 1
  topk: 4
  quiet: false
  ip: 127.0.0.1
  port: 55557
  debug_from: -1
  detect_anomaly: false
  start_checkpoint: null

export:
  output_relative: langsplat_export
  checkpoint: null
  levels: [0]
  queries:
    - elephant
    - camera
    - object
    - things
    - stuff
    - texture
  topk: 4
