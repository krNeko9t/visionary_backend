# LangSplatV2：preprocess.py + train.py
# source_path / model_path / start_checkpoint 由 executor 注入
preprocess:
  resolution: -1

model:
  sh_degree: 3
  resolution: -1
  white_background: false
  feature_level: 0

optimization:
  iterations: 30000
  position_lr_max_steps: 30000
  vq_layer_num: 1

training:
  test_iterations: [2000, 6000, 15000, 30000]
  save_iterations: [2000, 6000, 15000, 30000]
  checkpoint_iterations: [2000, 6000, 15000, 30000]
  topk: 8
