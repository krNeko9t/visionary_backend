services:
  task-server:
    build:
      context: .
      dockerfile: docker/task-server/Dockerfile
    image: visionary-task-server:local
    container_name: visionary-task-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./visionary_tasks:/workspace/visionary_tasks
      # 生产环境：取消注释下一行，用 production.yaml 覆盖 active.yaml
      # - ./visionary_tasks/configs/server/production.yaml:/workspace/visionary_tasks/configs/server/active.yaml:ro
    gpus: all

  web-demo:
    image: node:20-alpine
    container_name: visionary-web-demo
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./client-demo:/app

  colmap-worker:
    build:
      context: .
      dockerfile: docker/colmap-worker/Dockerfile
    image: visionary-colmap-worker:local
    profiles:
      - tools

  langsplat-worker:
    build:
      context: ./docker_workers/LangSplatV2
      dockerfile: Dockerfile
    image: langsplatv2:pt241
    profiles:
      - tools
    volumes:
      - ./ckpts:/workspace/ckpts

  # GaussianWrapping Dockerfile 使用 RUN --mount=type=cache，需 BuildKit。
  # Docker Desktop 默认已开启；若 build 失败，先执行：$env:DOCKER_BUILDKIT=1
  gaussian-wrapping-worker:
    build:
      context: ./docker_workers/GaussianWrapping
      dockerfile: Dockerfile
    image: gaussian-wrapping:latest
    profiles:
      - tools

  3dgs-to-pc-worker:
    build:
      context: ./docker_workers/3dgsToPc
      dockerfile: Dockerfile
    image: 3dgs-to-pc:latest
    profiles:
      - tools
