services:
  task-server:
    build:
      context: .
      dockerfile: docker/task-server/Dockerfile
    image: visionary-task-server:local
    container_name: visionary-task-server
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - ./data:/data
      - ./ckpts:/workspace/ckpts:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./visionary_tasks:/workspace/visionary_tasks
      # 生产环境：取消注释下一行，用 production.yaml 覆盖 active.yaml
      # - ./visionary_tasks/configs/server/production.yaml:/workspace/visionary_tasks/configs/server/active.yaml:ro
  web-demo:
    image: node:20-alpine
    container_name: visionary-web-demo
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    ports:
      - "5173:5173"
    environment:
      # 浏览器只访问 5173；Vite 在 Compose 网络内把 /api 转发给 task-server。
      VITE_PROXY_TARGET: http://task-server:8000
    depends_on:
      task-server:
        condition: service_healthy
    volumes:
      - ./client-demo:/app
      - /app/node_modules

  colmap-worker:
    build:
      context: .
      dockerfile: docker/colmap-worker/Dockerfile
    image: visionary-colmap-worker:local
    profiles:
      - tools

  3dgs-worker:
    build:
      context: ./docker_workers/GaussianSplatting
      dockerfile: Dockerfile
    image: visionary-3dgs-worker:local
    profiles:
      - tools

  langsplat-worker:
    build:
      context: ./docker_workers/LangSplatV2
      dockerfile: Dockerfile
    image: langsplatv2:pt241
    profiles:
      - tools
    environment:
      HF_HOME: /cache/models/huggingface
      HF_HUB_CACHE: /cache/models/huggingface/hub
      TORCH_HOME: /cache/models/torch
    volumes:
      - ./ckpts:/workspace/ckpts:ro
      - ./data/cache/models:/cache/models

  # GaussianWrapping Dockerfile 使用 RUN --mount=type=cache，需 BuildKit。
  # Docker Desktop 默认已开启；若 build 失败，先执行：$env:DOCKER_BUILDKIT=1
  gaussian-wrapping-worker:
    build:
      context: ./docker_workers/GaussianWrapping
      dockerfile: Dockerfile
    image: gaussian-wrapping:latest
    profiles:
      - tools

  3dgs-to-pc-worker:
    build:
      context: ./docker_workers/3dgsToPc
      dockerfile: Dockerfile
    image: 3dgs-to-pc:latest
    profiles:
      - tools
