worker_image: gaussian-wrapping:latest

runtime:
  output_relative: output

model:
  sh_degree: 3
  images: images
  resolution: -1
  white_background: false
  data_device: cpu
  eval: false

optimization:
  iterations: 30000
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_dc_lr: 0.0013
  feature_rest_lr: 0.00011
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002
  random_background: false

pipeline:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false

training:
  output_iteration: 30000
  save_iterations: [30000]
  checkpoint_iterations: [30000]
  test_iterations: [7000, 30000]
  quiet: true
  ip: 127.0.0.1
  port: -1
  debug_from: -1
  detect_anomaly: false
  start_checkpoint: null

gw:
  rasterizer: ours
  exposure_compensation: true
  multiview: true
  multiview_config: fast
  multiview_factor: 1.0
  regularization_from_iter: 7000
  lambda_depth_normal: 0.05
  use_max_size_threshold: false
  N_max_gaussians: 6000000
  normal_field_config: default_regular_densification
