model:
  resolution: 4
optimization:
  iterations: 12000
  densify_from_iter: 500
  densify_until_iter: 6000
  densification_interval: 150
  densify_grad_threshold: 0.00035
  opacity_reset_interval: 3000
  lambda_dssim: 0.2
pipeline:
  antialiasing: false
training:
  output_iteration: 12000
  save_iterations: [12000]
  checkpoint_iterations: [12000]
  test_iterations: [7000, 12000]